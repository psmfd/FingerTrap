name: apple-silicon-candidate

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/apple-silicon-candidate.yml
      - .github/workflows/macos-worker.yml
      - scripts/ci/validate-macos.sh
      - scripts/smoke-pty.py
      - scripts/stage-native-lib.sh
      - src-sidecar/**
      - src-tauri/**
      - src-ui/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    name: package and smoke (Apple Silicon)
    uses: psmfd/FingerTrap/.github/workflows/macos-worker.yml@cf1cd50ca296ad2b35711b028acfe2f66f7c8aa4
    with:
      lane: candidate
